<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirIndia</title>
    <link rel="icon" href="air-india-logo.webp">
</head>
<body>
    <center>
        <h1>AIR INDIA</h1>
        <hr>
        <pre>Login                                                     SignUP                                               Search                                                      Register</pre>
        <hr>
        <img src="air-india-logo.webp" alt="AirIndiaLogo" width="200px" height="200px">
        <hr>
        <table border="2px">
            <tr align="center">
                <th colspan="2">Book Ticket</th>
                <!-- <td></td> -->
            </tr>
            <tr>
                <td>
                    <form>
                        <fieldset>
                            <legend>From</legend>
                            <label for="1">From
                            <input id="1">
                            </label>
                        </fieldset>
                    </form>
                </td>
                <td>
                    <form action="">
                        <fieldset>
                            <legend >Destination</legend>
                            <Label for="2">To</Label>
                            <input id="2">
                        </fieldset>
                    </form>
                </td>
            </tr>
            <tr>
                <td>
                    <form action="">
                        <fieldset>
                            <legend for="3">From Date</legend>
                            <input id="3" type="datetime-local">
                        </fieldset>
                    </form>
                </td>
                <td>
                    <form action="">
                        <fieldset>
                            <legend for="4">Return</legend>
                            <input id="4" type="datetime-local">
                        </fieldset>
                    </form>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="radio" name="1">Adult
                    <input type="radio" name="1">Student
                    <input type="radio" name="1">Senior Citizen
                </td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <button>Submit</button>
                </td>
                <!-- <td></td> -->
            </tr>
        </table>
    </center>
</body>
</html>
